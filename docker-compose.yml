services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: web_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      # Mount frontend source for instant hot-reload across developer machines
      - ./src/frontend:/app
      # Prevent host node_modules from clobbering container node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - BACKEND_INTERNAL_URL=http://backend:8000
    networks:
      - app-net
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: web_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Mount backend source for hot-reload across developer machines
      - ./src/backend:/app
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PORT=8000
      - ALLOWED_ORIGINS=http://localhost:${FRONTEND_PORT:-3000}
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
