services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: web_frontend
    restart: unless-stopped
    ports:
      # Developer can directly access the container's Nginx on host port 3000
      # In production, Host Nginx reverse proxies to this port
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - app-net
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: web_backend
    restart: unless-stopped
    ports:
      # Optional: expose backend directly for debugging if needed
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=docuser
      - DB_PASSWORD=docpass
      - DB_NAME=docforge
    networks:
      - app-net
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: db_mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=docforge
      - MYSQL_USER=docuser
      - MYSQL_PASSWORD=docpass
      - MYSQL_ROOT_PASSWORD=rootpass
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "docuser", "-pdocpass"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
