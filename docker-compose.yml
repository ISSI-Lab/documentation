services:
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: web_frontend
    restart: unless-stopped
    ports:
      # Developer can directly access the container's Nginx on host port 3939
      # In production, Host Nginx reverse proxies to this port
      - "${FRONTEND_PORT:-3939}:80"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - app-net
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: web_backend
    restart: unless-stopped
    ports:
      # Optional: expose backend directly for debugging if needed
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=docuser
      - DB_PASSWORD=docpass
      - DB_NAME=docforge
      - EMAIL_CONFIG_SECRET=${EMAIL_CONFIG_SECRET:-docforge-email-secret-key-2026}
    volumes:
      - ./src/backend/config:/app/config:ro
    networks:
      - app-net
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: db_mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=docforge
      - MYSQL_USER=docuser
      - MYSQL_PASSWORD=docpass
      - MYSQL_ROOT_PASSWORD=rootpass
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "docuser", "-pdocpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: db_phpmyadmin
    restart: unless-stopped
    profiles:
      - pma
      - phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      MEMORY_LIMIT: 256M
    ports:
      - "${PMA_PORT:-28080}:80"
    networks:
      - app-net
    depends_on:
      mysql:
        condition: service_healthy

networks:
  app-net:
    driver: bridge

volumes:
  mysql_data:
    driver: local

