# ==============================================================================
# Host Machine Nginx Configuration Example
# ==============================================================================
# Place this in /etc/nginx/sites-available/docforge and symlink to sites-enabled,
# or include it inside your main nginx.conf on the host machine.
#
# Traffic Flow:
# Client Browser -> Host Nginx (:80/:443) -> Container Nginx (:3000) -> NodeJS (:5000) -> MySQL (:3306)
# ==============================================================================

server {
    listen 80;
    server_name docs.yourcompany.internal localhost;

    # Maximum file upload size (if uploading attachments/images)
    client_max_body_size 50M;

    location / {
        # Forward all traffic to the Docker Container's Nginx port (mapped to 3000 on the host)
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
